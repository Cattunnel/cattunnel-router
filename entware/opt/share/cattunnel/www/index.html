<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>CatTunnel на роутере</title>
<style>
/* Цвета — из приложения CatTunnel (lib/common/theme/theme_palette.dart): сталь, янтарь, кирпич. */
:root {
	--steel:#3972AA; --steel-2:#4F8AC4; --amber:#F08400; --brick:#F44725; --ok:#2E8B57;
	--paper:#FFFFFF; --mist:#F6F7F9; --line:#E2E6EC; --ink:#30353B; --ink-2:#6A727E;
	--r-section:10px; --r-control:6px;
}
@media (prefers-color-scheme: dark) {
	:root { --paper:#1B1F26; --mist:#141820; --line:#2B323D; --ink:#E6E9EE; --ink-2:#98A1AE; --steel:#6FA0D6; --steel-2:#8DB5E2; --ok:#5CC28A; }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--mist); color:var(--ink); font:15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; }
:focus-visible { outline:2px solid var(--steel); outline-offset:2px; }

/* шапка: Марсик + название + вкладки */
header { background:var(--paper); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
.bar { max-width:880px; margin:0 auto; padding:12px 16px 0; }
.who { display:flex; align-items:center; gap:12px; }
.who h1 { font-size:18px; font-weight:600; margin:0; letter-spacing:-.01em; }
.who p { margin:0; color:var(--ink-2); font-size:13px; }
#marsik { width:44px; height:44px; flex:none; }
#marsik .head { fill:var(--ink); }
#marsik .eye { fill:var(--paper); transition:transform .25s; transform-box:fill-box; transform-origin:center; }
#marsik .pupil { fill:var(--ok); }
#marsik .lid, #marsik .cross { display:none; }
#marsik[data-state="up"] .eye { animation:blink 6s infinite; }
#marsik[data-state="wait"] .pupil { fill:var(--amber); }
#marsik[data-state="wait"] .lid { display:block; fill:var(--ink); }
#marsik[data-state="down"] .eye, #marsik[data-state="down"] .pupil { display:none; }
#marsik[data-state="down"] .cross { display:block; stroke:var(--brick); stroke-width:2.4; stroke-linecap:round; }
#marsik[data-state="unknown"] .pupil { fill:var(--ink-2); }
@keyframes blink { 0%, 95%, 100% { transform:scaleY(1); } 97% { transform:scaleY(.1); } }
@media (prefers-reduced-motion: reduce) { #marsik .eye { animation:none !important; } }

#tabs { display:flex; gap:2px; margin-top:10px; overflow-x:auto; scrollbar-width:none; }
#tabs::-webkit-scrollbar { display:none; }
#tabs a { padding:9px 12px 10px; color:var(--ink-2); text-decoration:none; border-bottom:2px solid transparent; white-space:nowrap; font-weight:500; }
#tabs a:hover { color:var(--ink); }
#tabs a.active { color:var(--steel); border-bottom-color:var(--steel); }

main { max-width:880px; margin:0 auto; padding:18px 16px 28px; }

/* классы LuCI, которыми пользуются страницы CatTunnel */
h2 { font-size:24px; line-height:1.25; font-weight:600; margin:0 0 6px; letter-spacing:-.015em; }
h3 { font-size:18px; font-weight:600; margin:0 0 6px; }
h4 { font-size:15px; font-weight:600; margin:0 0 8px; }
.cbi-map-descr { color:var(--ink-2); margin:0 0 16px; max-width:68ch; }
.cbi-section-descr, .cbi-value-description { color:var(--ink-2); font-size:13px; max-width:68ch; }
.cbi-value-description { margin-top:4px; }
.cbi-section { background:var(--paper); border:1px solid var(--line); border-radius:var(--r-section); padding:16px 18px; margin:0 0 14px; }
.cbi-section > h3:first-child { margin-top:0; }
.cbi-value { display:grid; grid-template-columns:minmax(150px, 220px) 1fr; gap:6px 18px; padding:10px 0; border-top:1px solid var(--line); }
.cbi-value:first-of-type { border-top:0; padding-top:4px; }
.cbi-value-title { font-weight:600; padding-top:6px; }
.cbi-value-field { min-width:0; }
@media (max-width: 620px) { .cbi-value { grid-template-columns:1fr; } .cbi-value-title { padding-top:0; } }

input[type=text], input[type=password], input[type=number], select, textarea {
	font:inherit; color:var(--ink); background:var(--mist); border:1px solid var(--line); border-radius:var(--r-control);
	padding:7px 9px; max-width:100%; min-height:36px; }
input[type=checkbox] { width:18px; height:18px; accent-color:var(--steel); vertical-align:-3px; }
select { padding-right:28px; }
.btn, button { font:inherit; font-weight:500; min-height:36px; padding:6px 14px; border-radius:var(--r-control); cursor:pointer;
	border:1px solid var(--line); background:var(--paper); color:var(--ink); }
.btn:hover, button:hover { border-color:var(--steel-2); }
.btn:disabled, button:disabled { opacity:.5; cursor:progress; }
.cbi-button-action { color:var(--steel); border-color:var(--steel); }
.cbi-button-positive { background:var(--steel); border-color:var(--steel); color:#fff; }
.cbi-button-negative { color:var(--brick); border-color:var(--brick); background:transparent; }
.cbi-page-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 14px; }

table.table { width:100%; border-collapse:collapse; }
.table .tr { display:table-row; }
.table .td, .table .th { display:table-cell; padding:8px 10px 8px 0; border-top:1px solid var(--line); vertical-align:top; }
.table .tr:first-child .td { border-top:0; }
.td.left { text-align:left; }
@media (max-width: 620px) {
	.table, .table tbody, .table .tr, .table .td { display:block; width:100% !important; }
	.table .td:first-child { padding-bottom:0; color:var(--ink-2); font-size:13px; border-top:1px solid var(--line); }
	.table .td + .td { border-top:0; padding-top:2px; }
	.table .th { display:none; }   /* заголовки колонок на узком экране лишние: строки и так подписаны */
}
pre { background:var(--mist); border:1px solid var(--line); border-radius:var(--r-control); padding:10px 12px; overflow:auto;
	font:13px/1.5 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
ul { padding-left:20px; margin:6px 0; }
li { margin:3px 0; }

.alert-message { border:1px solid var(--line); border-left:4px solid var(--steel); background:var(--paper); border-radius:var(--r-control);
	padding:10px 14px; margin:0 0 12px; }
.alert-message.warning { border-left-color:var(--amber); }
.alert-message.danger, .alert-message.error { border-left-color:var(--brick); }
.alert-message p { margin:0; }

#notifications { position:fixed; right:12px; bottom:12px; width:min(420px, calc(100vw - 24px)); z-index:20; display:grid; gap:8px; }
#notifications .alert-message { margin:0; cursor:pointer; white-space:pre-wrap; box-shadow:0 6px 24px rgba(48,53,59,.18); }

.modal-overlay { position:fixed; inset:0; background:rgba(20,24,32,.5); display:flex; align-items:flex-start; justify-content:center;
	padding:6vh 12px; z-index:15; overflow:auto; }
.modal { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:18px; width:min(720px, 100%); }
.loading { color:var(--ink-2); }
/* «Справка»: длинный текст — короче строка, код без рамки */
.help { max-width:none; } .help p, .help li { max-width:72ch; }
.help h2 { font-size:22px; margin-top:4px; } .help h3 { margin-top:18px; }
.help code { font:13px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; background:var(--mist); border:1px solid var(--line);
	border-radius:4px; padding:1px 4px; overflow-wrap:anywhere; }
.help a { color:var(--steel); }
footer { max-width:880px; margin:0 auto; padding:0 16px 28px; color:var(--ink-2); font-size:13px; }
</style>
<script src="luci-shim.js"></script>
</head>
<body>
<header>
	<div class="bar">
		<div class="who">
			<!-- Марсик: глаза показывают туннель — открыты (работает), сонные (ждёт устройства), крестиком (остановлен) -->
			<svg id="marsik" data-state="unknown" viewBox="0 0 48 48" role="img" aria-label="Состояние туннеля">
				<path class="head" d="M8 6 L18 15 Q24 13 30 15 L40 6 L40 30 Q40 43 24 43 Q8 43 8 30 Z"/>
				<ellipse class="eye" cx="17" cy="26" rx="5" ry="5.4"/>
				<ellipse class="eye" cx="31" cy="26" rx="5" ry="5.4"/>
				<ellipse class="pupil" cx="17" cy="26.5" rx="2" ry="3.4"/>
				<ellipse class="pupil" cx="31" cy="26.5" rx="2" ry="3.4"/>
				<rect class="lid" x="11" y="20" width="12" height="5.5"/>
				<rect class="lid" x="25" y="20" width="12" height="5.5"/>
				<path class="cross" d="M14 23 L20 29 M20 23 L14 29 M28 23 L34 29 M34 23 L28 29"/>
			</svg>
			<div>
				<h1>CatTunnel на роутере</h1>
				<p id="who-state">Смотрю, как дела у туннеля…</p>
			</div>
		</div>
		<nav id="tabs" aria-label="Разделы"></nav>
	</div>
</header>
<main id="view"></main>
<footer>Страница открывается только из домашней сети. Пароль — внизу «Настроек» (или командой cattunnel web password).</footer>
<div id="notifications" aria-live="polite"></div>
</body>
</html>
